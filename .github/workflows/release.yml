name: Release

# Push a tag named after the plugin version, e.g. v0.1 for PLUGIN_VERSION=0.1
# (v0.1_1 when PLUGIN_REVISION=1), to build and publish os-wan8021x-*.pkg.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Check tag against PLUGIN_VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mk=net/wan8021x/Makefile
          want=$(sed -n 's/^PLUGIN_VERSION=[[:space:]]*//p' "$mk")
          rev=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' "$mk")
          if [ -n "$rev" ] && [ "$rev" != 0 ]; then want=${want}_$rev; fi
          if [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match plugin version $want"
            exit 1
          fi

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      release: true

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Checksums
        run: cd dist && sha256sum -- *.pkg > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "os-wan8021x $GITHUB_REF_NAME" \
            --generate-notes --verify-tag
