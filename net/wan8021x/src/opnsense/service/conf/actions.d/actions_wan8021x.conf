[start]
command:/usr/local/etc/rc.d/wan8021x start
type:script
message:starting WAN 802.1X supplicant

[stop]
command:/usr/local/etc/rc.d/wan8021x stop
type:script
message:stopping WAN 802.1X supplicant

[restart]
command:/usr/local/etc/rc.d/wan8021x restart
type:script
message:restarting WAN 802.1X supplicant

[status]
command:/usr/local/etc/rc.d/wan8021x status
errors:no
type:script_output
message:WAN 802.1X supplicant status

[supplicants]
command:/usr/local/opnsense/scripts/OPNsense/Wan8021x/ctl.py supplicants
errors:no
type:script_output
message:WAN 802.1X per interface status

[reauthenticate]
command:/usr/local/opnsense/scripts/OPNsense/Wan8021x/ctl.py reauthenticate
parameters:%s
type:script_output
message:re-authenticating 802.1X on %s
