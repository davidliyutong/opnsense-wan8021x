port=0
bind-dynamic
log-dhcp
dhcp-authoritative
interface=tap-wan
dhcp-range=set:wan_default,172.31.0.100,172.31.0.199,255.255.255.0,1h
dhcp-option=tag:wan_default,option:router,172.31.0.1
# Only one of these subnets has an address on tap-wan at a time. Switching
# that address emulates a switch moving a client out of its pre-auth network.
dhcp-range=set:wan_changed,172.31.10.100,172.31.10.199,255.255.255.0,1h
dhcp-option=tag:wan_changed,option:router,172.31.10.1
interface=tap-wan.100
dhcp-range=tap-wan.100,172.31.100.100,172.31.100.199,255.255.255.0,1h
dhcp-option=tap-wan.100,option:router,172.31.100.1
interface=tap-wan.200
dhcp-range=tap-wan.200,172.31.200.100,172.31.200.199,255.255.255.0,1h
dhcp-option=tap-wan.200,option:router,172.31.200.1
